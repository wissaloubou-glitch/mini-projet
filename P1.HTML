<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Informations Kia Sportage</title>
</head>
<style>
     body {
       background-image:linear-gradient(to right, #0a0202, #b8860b) ;
       color: rgb(223, 222, 222);
       font-family: Arial;
       text-align: center;
     }
     img{
         width: 30%;
            height: 220px;
            object-fit: cover;
            border-radius: 20px;
            border: 2px solid #222;
     }
     .volkswagen{
        display:column;
     }
     .info-section {
            text-align: left;
            padding: 20px;
            background: #000;
            border-radius: 15px;
            border-left: 5px solid #b8860b;
            margin: 30px;
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .info-header h1 {
            color: #b8860b;
            margin: 0;
            font-size: 28px;
        }

        .price-tag {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        .specs-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .spec-item {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        .spec-item b {
             color: #b8860b;
         }
        button{
            background-color: rgb(155, 155, 15);
            padding: 10px 60px;
            border-radius: 10px;
            border-color: black;
            border: solid;
            font-size: 18px;
            cursor: pointer;
        }
</style>
<body>
    <div class="volkswagen">
    <div class="volkswagen1">
        <img src="https://i.pinimg.com/1200x/ef/40/67/ef4067f52d76aa88a5a0d865bfc10b0e.jpg">
        <img src="https://tse4.mm.bing.net/th/id/OIP.D0Il9BwOud2ywQTVxAtn8wHaE7?pid=ImgDet&w=474&h=315&rs=1&o=7&rm=3">
    </div>    
    <div class="volkswagen2">
        <img src="https://tse2.mm.bing.net/th/id/OIP.NfLklmgeRGx6vLasHhZxYgHaE8?pid=ImgDet&w=474&h=316&rs=1&o=7&rm=3">
        <img src="https://tse4.mm.bing.net/th/id/OIP.Ray2OMXaL-u0X8qilDG1rQHaE7?pid=ImgDet&w=474&h=315&rs=1&o=7&rm=3">
    </div>
    <div class="info-section">
            <div class="info-header">
                <h1>Kia Sportage GT-Line</h1>
                <div class="price-tag">350 DH <small>/ Jour</small></div>
            </div>
            <div class="specs-list">
                <div class="spec-item"><b>Moteur:</b> 1.6 T-GDi</div>
                <div class="spec-item"><b>Puissance:</b> 180 ch</div>
                <div class="spec-item"><b>Transmission:</b> Automatique DCT 7</div>
                <div class="spec-item"><b>Carburant:</b> Essence / Hybride</div>
                <div class="spec-item"><b>Équipements:</b> Caméra 360°, Sièges ventilés</div>
                <div class="spec-item"><b>Catégorie:</b> SUV Compact Premium</div>
            </div>
    </div>
    <div class="reserver">
    <a href="reserver.html">
        <button type="submit">Réserver</button>
    </a>
    </div>
    </div>
</body>
</html>
