<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Informations voitures</title>
<link rel="stylesheet" href="style.css">
</head>
<style>
     body {
       background-image:linear-gradient(to right, #0a0202, #b8860b) ;
       color: rgb(223, 222, 222);
       font-family: Arial;
       text-align: center;
     }
     img{
         width: 30%;
            height: 220px;
            object-fit: cover;
            border-radius: 20px;
            border: 2px solid #222;
     }
     .skoda{
        display:column;
     }
     .info-section {
            text-align: left;
            padding: 20px;
            background: #000;
            border-radius: 15px;
            border-left: 5px solid #b8860b;
            margin: 30px;
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .info-header h1 {
            color: #b8860b;
            margin: 0;
            font-size: 28px;
        }

        .price-tag {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        .specs-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .spec-item {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        .spec-item b {
             color: #b8860b;
         }
        button{
            background-color: rgb(155, 155, 15);
            padding: 10px 60px;
            border-radius: 10px;
            border-color: black;
            border: solid;
            font-size: 18px;
            
        }

</style>
<body>
    <div class=skoda>
    <div class="skoda1">
        <img src="https://i.pinimg.com/1200x/44/ea/36/44ea3622ae5bb39e08e5176b69d71e71.jpg">
        <img src="https://i.pinimg.com/736x/07/4a/f9/074af9708c119ad901a4d85a4993afca.jpg">
    </div>    
    <div class="skoda2">
        <img src="https://i.pinimg.com/736x/08/f3/98/08f39832cf525d726f94029b792caf06.jpg">
        <img src="https://i.pinimg.com/1200x/e7/01/99/e701994bfb9017471fab93781c783760.jpg">
    </div>
    <div class="info-section">
            <div class="info-header">
                <h1>Skoda kodiaq</h1>
                <div class="price-tag">500 DH <small>/ Jour</small></div>
            </div>
            <div class="specs-list">
                <div class="spec-item"><b>Moteur:</b> 2.0 TDI 4</div>
                <div class="spec-item"><b>Puissance:</b> 150 ch</div>
                <div class="spec-item"><b>Transmission:</b> Automatique DSG 7 rapports</div>
                <div class="spec-item"><b>Carburant:</b> Diesel</div>
                <div class="spec-item"><b>Équipements:</b> Toit panoramique, Cockpit Digital , 7 Places</div>
                <div class="spec-item"><b>Catégorie:</b> SUV Familial</div>
            </div>
    </div>
    <div class="reserver">
    <a href="reserver.html">
        <button type="submit">Réserver</button>
    </a>
    </div>
    </div>
</body>
