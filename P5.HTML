<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Informations voitures</title>
<link rel="stylesheet" href="style.css">
</head>
<style>
     body {
       background-image:linear-gradient(to right, #0a0202, #b8860b) ;
       color: rgb(223, 222, 222);
       font-family: Arial;
       text-align: center;
     }
     img{
         width: 30%;
            height: 220px;
            object-fit: cover;
            border-radius: 20px;
            border: 2px solid #222;
     }
     .volkswagen{
        display:column;
     }
     .info-section {
            text-align: left;
            padding: 20px;
            background: #000;
            border-radius: 15px;
            border-left: 5px solid #b8860b;
            margin: 30px;
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .info-header h1 {
            color: #b8860b;
            margin: 0;
            font-size: 28px;
        }

        .price-tag {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        .specs-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .spec-item {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        .spec-item b {
             color: #b8860b;
         }
        button{
            background-color: rgb(155, 155, 15);
            padding: 10px 60px;
            border-radius: 10px;
            border-color: black;
            border: solid;
            font-size: 18px;
            
        
        }
        

</style>
<body>
    <div class=volkswagen>
    <div class="volkswagen1">
        <img src="https://i.pinimg.com/736x/e7/2a/be/e72abe0bb25e86eaf287b2a6aca5786d.jpg">
        <img src="https://i.pinimg.com/1200x/bf/10/12/bf1012ea92856d76b3b4bc90a7dccb23.jpg">
    </div>    
    <div class="volkswagen2">
        <img src="https://i.pinimg.com/1200x/fa/22/70/fa2270776180dd252cd2668014e26dd1.jpg">
        <img src="https://i.pinimg.com/1200x/b6/85/99/b68599d247f0cefcfdc032384f40ba21.jpg">
    </div>
    <div class="info-section">
            <div class="info-header">
                <h1>Volkswagen Touareg T-ROC R</h1>
                <div class="price-tag">600 DH <small>/ Jour</small></div>
            </div>
            <div class="specs-list">
                <div class="spec-item"><b>Moteur:</b> 3.0 V6 TDI</div>
                <div class="spec-item"><b>Puissance:</b> 286 ch</div>
                <div class="spec-item"><b>Transmission:</b> Automatique 8 rapports</div>
                <div class="spec-item"><b>Carburant:</b> Diesel</div>
                <div class="spec-item"><b>Équipements:</b> Toit panoramique, Cockpit Digital</div>
                <div class="spec-item"><b>Catégorie:</b> SUV de Luxe</div>
            </div>
    </div>
    <div class="reserver">
    <a href="reserver.html">
        <button type="submit">Réserver</button>
    </a>
    </div>
    </div>
</body>
